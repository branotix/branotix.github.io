<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand"><span class="badge">PK</span>Pulock Kumar</a>
    <button class="nav-toggle" aria-expanded="false" aria-label="Toggle menu">Menu</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="blog.html" aria-current="page">Blog</a></li>
      <li><a href="contact.html" class="nav-cta">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="index.html">Home</a> / Blog</p>
      <p class="eyebrow">[LOG]</p>
      <h1>The build log.</h1>
      <p>Notes on what I'm building, what breaks along the way, and what I'm learning — written as I go, not after the fact.</p>
    </div>
  </section>

  <section style="padding-top: 10px;">
    <div class="container">
      <div class="grid-3" id="blog-grid"></div>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-log"><span class="ok">●</span> process exited 0 — built by Pulock Kumar, © <span data-year></span></div>
      <div class="footer-socials">
        <a class="icon-link" href="https://github.com/branotix" target="_blank" rel="noopener" aria-label="GitHub"></a>
        <a class="icon-link" href="https://www.linkedin.com/in/branotix" target="_blank" rel="noopener" aria-label="LinkedIn"></a>
        <a class="icon-link" href="contact.html" aria-label="Contact"></a>
      </div>
    </div>
  </div>
</footer>

<script src="js/icons.js"></script>
<script src="js/posts-data.js"></script>
<script src="js/main.js"></script>
<script>
  document.querySelectorAll(".icon-link[aria-label='GitHub']").forEach(e => e.innerHTML = ICONS.github);
  document.querySelectorAll(".icon-link[aria-label='LinkedIn']").forEach(e => e.innerHTML = ICONS.linkedin);
  document.querySelectorAll(".icon-link[aria-label='Contact']").forEach(e => e.innerHTML = ICONS.mail);

  const grid = document.getElementById("blog-grid");

  if (!POSTS || !POSTS.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">// no posts published yet — check back soon</div>`;
  } else {
    const sorted = [...POSTS].sort((a, b) => new Date(b.date) - new Date(a.date));
    sorted.forEach(post => {
      const el = document.createElement("a");
      el.href = `post.html?slug=${post.slug}`;
      el.className = "post-card";
      el.innerHTML = `
        <img src="${post.cover}" alt="${post.title}" loading="lazy">
        <div class="post-body">
          <span class="post-date">${post.displayDate}</span>
          <h3>${post.title}</h3>
          <p style="font-size:14px;">${post.summary}</p>
          <span class="post-read">Read post ${ICONS.arrowRight}</span>
        </div>
      `;
      grid.appendChild(el);
    });
  }
</script>
</body>
</html>
